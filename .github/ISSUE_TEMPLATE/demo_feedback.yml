name: Demo feedback
description: Tell us which synthetic demo step or screen was confusing.
title: "[Demo feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Feedback from first-time testers is welcome. Your GitHub username is
        sufficient contact information.
        Use synthetic data only. Never attach real statements, account identifiers,
        ledgers, access tokens, credentials, or private screenshots.
        For vulnerabilities, follow [SECURITY.md](https://github.com/dv85/finance-assistant/blob/main/SECURITY.md).
  - type: textarea
    id: step
    attributes:
      label: Demo step or screen
      description: Which README command, setup step, or screen did you try?
      placeholder: "Example: opening Activity after loading the synthetic demo."
    validations:
      required: true
  - type: textarea
    id: confusing
    attributes:
      label: What was confusing?
      description: Explain what you saw or which instruction was difficult to follow.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What would help you complete that step?
    validations:
      required: true
